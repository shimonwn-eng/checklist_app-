<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>פתיחת יום עבודה – ניר עציון</title>
<style>
:root {
  --red: #c0001a;
  --red-dark: #8a0013;
  --red-light: #fdf0f2;
  --green: #3b6d11;
  --green-light: #eaf3de;
  --green-mid: #639922;
  --danger: #a32d2d;
  --danger-light: #fcebeb;
  --danger-border: #e24b4a;
  --blue: #185fa5;
  --blue-light: #e6f1fb;
  --gray: #f5f4f0;
  --gray2: #e8e6e0;
  --gray3: #888;
  --border: #ddd;
  --text: #1a1a1a;
  --text2: #555;
  --radius: 12px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #f2f0eb; font-family: -apple-system, 'Segoe UI', Arial, sans-serif; color: var(--text); }
.app { max-width: 480px; margin: 0 auto; padding-bottom: 100px; }

/* HEADER */
.header { background: white; border-bottom: 1px solid var(--border); padding: 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.header-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
.logo-nir { height: 40px; object-fit: contain; }
.logo-neat { height: 30px; object-fit: contain; }
.header-title { text-align: center; flex: 1; }
.header-title h1 { font-size: 13px; font-weight: 600; color: var(--red); line-height: 1.3; }
.header-title p { font-size: 10px; color: var(--text2); margin-top: 1px; }
.header-bar { background: var(--red); height: 3px; }

/* SUMMARY STRIP */
.sum-strip { display: grid; grid-template-columns: repeat(3,1fr); background: white; border-bottom: 1px solid var(--border); }
.sum-item { text-align: center; padding: 8px 4px; border-left: 0.5px solid var(--border); }
.sum-item:last-child { border-left: none; }
.sum-num { font-size: 22px; font-weight: 700; line-height: 1; }
.sum-lbl { font-size: 10px; color: var(--text2); margin-top: 2px; }
.s-ok { color: var(--green); }
.s-bad { color: var(--danger); }
.s-na { color: var(--gray3); }

/* META FORM */
.section { padding: 12px 14px; }
.meta-card { background: white; border-radius: var(--radius); border: 1px solid var(--border); padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mf { display: flex; flex-direction: column; gap: 4px; }
.mf.full { grid-column: 1/-1; }
.mf label { font-size: 11px; color: var(--text2); font-weight: 500; }
.mf input { font-size: 14px; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--gray); color: var(--text); outline: none; transition: border-color .15s; }
.mf input:focus { border-color: var(--red); background: white; }

/* DEPT CARDS */
.dept-wrap { padding: 0 14px 8px; }
.dept-card { background: white; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; transition: box-shadow .2s; }
.dept-card.has-bad { border-color: var(--danger-border); }
.dept-hdr { display: flex; align-items: center; justify-content: space-between; padding: 13px 15px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.dept-left { display: flex; align-items: center; gap: 10px; }
.dept-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--red-light); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.dept-title { font-size: 14px; font-weight: 600; color: var(--text); }
.dept-meta { font-size: 11px; color: var(--text2); margin-top: 1px; }
.dept-right { display: flex; align-items: center; gap: 8px; }
.dbadge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; }
.bok { background: var(--green-light); color: var(--green); }
.bbad { background: var(--danger-light); color: var(--danger); }
.bpend { background: var(--gray); color: var(--gray3); }
.chev { font-size: 12px; color: var(--gray3); transition: transform .25s; }
.chev.open { transform: rotate(180deg); }

.dept-body { display: none; border-top: 1px solid var(--border); }
.dept-body.open { display: block; }

/* TEMPS */
.temps-section { padding: 12px 15px; background: #fafaf8; border-bottom: 1px solid var(--border); }
.section-label { font-size: 10px; font-weight: 700; color: var(--red); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 8px; }
.temps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.temp-zone { background: white; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; }
.temp-zone label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 5px; line-height: 1.3; }
.temp-row { display: flex; align-items: center; gap: 5px; }
.temp-inp { width: 58px; font-size: 16px; font-weight: 600; text-align: center; padding: 4px 6px; border: 1.5px solid var(--border); border-radius: 6px; background: var(--gray); color: var(--text); outline: none; }
.temp-inp:focus { border-color: var(--red); background: white; }
.temp-unit { font-size: 13px; color: var(--gray3); }

/* ITEMS */
.items-section { padding: 10px 15px; }
.item-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
.item-row:last-child { border-bottom: none; }
.item-top { display: flex; align-items: flex-start; gap: 8px; }
.item-name { font-size: 13px; color: var(--text); flex: 1; line-height: 1.4; padding-top: 2px; }
.item-cam-btn { background: var(--gray); border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; font-size: 15px; cursor: pointer; flex-shrink: 0; line-height: 1; -webkit-tap-highlight-color: transparent; }
.item-cam-btn.has-p { background: var(--green-light); border-color: var(--green-mid); }
.status-row { display: flex; gap: 5px; margin-top: 7px; }
.sb { flex: 1; padding: 7px 4px; font-size: 12px; font-weight: 500; border: 1.5px solid var(--border); border-radius: 8px; background: white; color: var(--text2); cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; transition: all .12s; }
.sb.aok { background: var(--green-light); border-color: var(--green-mid); color: var(--green); }
.sb.abad { background: var(--danger-light); border-color: var(--danger-border); color: var(--danger); }
.sb.ana { background: var(--gray); border-color: var(--gray2); color: var(--gray3); }
.note-toggle { font-size: 11px; color: var(--blue); background: none; border: none; cursor: pointer; padding: 4px 0; display: flex; align-items: center; gap: 3px; margin-top: 4px; }
.note-toggle.has-n { font-weight: 600; }
.item-note { width: 100%; margin-top: 6px; font-size: 13px; padding: 7px 9px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--gray); color: var(--text); resize: none; font-family: inherit; display: none; outline: none; }
.item-note.show { display: block; }
.item-note:focus { border-color: var(--blue); background: white; }
.thumbs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.thumb { width: 52px; height: 52px; border-radius: 7px; object-fit: cover; border: 1px solid var(--border); }
.hidden-file { display: none; }

/* DEPT NOTES */
.dept-notes-section { padding: 10px 15px 14px; background: #fafaf8; border-top: 1px solid var(--border); }
.dept-notes-section textarea { width: 100%; font-size: 13px; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; background: white; color: var(--text); resize: none; font-family: inherit; min-height: 52px; outline: none; }
.dept-notes-section textarea:focus { border-color: var(--blue); }

/* BOTTOM ACTIONS */
.actions-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid var(--border); padding: 10px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; z-index: 200; box-shadow: 0 -2px 12px rgba(0,0,0,0.1); }
.btn-wa { padding: 12px; background: #25d366; color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; -webkit-tap-highlight-color: transparent; }
.btn-mail { padding: 12px; background: var(--red); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; -webkit-tap-highlight-color: transparent; }
.btn-pdf { padding: 12px; background: white; color: var(--text); border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; grid-column: 1/-1; display: flex; align-items: center; justify-content: center; gap: 6px; -webkit-tap-highlight-color: transparent; }
.btn-wa:active, .btn-mail:active, .btn-pdf:active { opacity: .8; transform: scale(.98); }

/* PROGRESS BAR */
.progress-wrap { height: 4px; background: var(--gray2); }
.progress-bar { height: 4px; background: linear-gradient(90deg, var(--green), #7ec859); transition: width .4s; border-radius: 2px; }

/* Toast */
.toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 8px 18px; border-radius: 20px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>

<script>
const DEPTS = [
  { id:'bead', icon:'🥩', name:'מחלקת בע"ד', temps:['אזור טמבלים','אזור טחינה ועיצוב','אזור מסור'], items:['מסור חשמלי (כתלות בשימוש)','מערבל','מטחנה','מכונת קציצות','קוטר','שולחנות עבודה','רצפה','סביבה','קירות ודלתות','תעלות ניקוז','כיורים וברזים','קרשי חיתוך וסכינים','טמבלרים','משקל רצפתי'] },
  { id:'salads', icon:'🥗', name:'מחלקת סלטים', temps:["אזור ג'קוזי",'אזור קיצוץ','אזור ערבוב סלטים'], items:['כלים','שולחנות עבודה',"ג'קוזי קטן","ג'קוזי גדול",'קורנן קטן','קורנן גדול','מערבל סלטים','סטפן גדול','רצפה','קירות','דלתות מקרר','ניקוז תעלה'] },
  { id:'special', icon:'❄️', name:'חדר הכנות מיוחדות', temps:[], items:['מקררי הפשרת בצקים','שולחנות עבודה','רצפה','קירות ודלתות'] },
  { id:'prod-big', icon:'🍲', name:'אולם ייצור גדול', temps:[], items:['סירי בישול','מחבתות','תנורי אפייה','פחי אשפה','מטגנות רציפות','רצפה','תעלות ניקוז','סיר פסטה','תקרה'] },
  { id:'prod-parve', icon:'🫕', name:'אולם ייצור פרווה', temps:[], items:['תנורי אפיה','סירי בישול','מערבל','פחי אשפה','תעלות ניקוז','רצפה'] },
  { id:'corridors', icon:'🚶', name:'פרוזדורים', temps:[], items:['רצפה','אין סחורה בחוץ'] },
  { id:'pack', icon:'📦', name:'חדר אריזה', temps:[], items:['שולחנות עבודה','ציוד לאריזה','מכונות אריזה (1)','מכונות אריזה (2)','מכונות אריזה (3)','רצפה','סביבה','קירות ודלתות','תעלות ניקוז','מקררים'] },
  { id:'coolers', icon:'🧊', name:'מקררים מהירים', temps:[], items:['רצפה','תעלות ניקוז','קירות ודלתות'] },
  { id:'combi', icon:'⚙️', name:'קומבי רציף', temps:[], items:['כלים','שולחן עבודה','פינוי אשפה','רצפה','קירות ודלת מקרר','תעלות','פינוי ידני של המכונה'] },
  { id:'autoclave', icon:'🔬', name:'חדר אוטוקלב', temps:[], items:['רצפה','שולחנות','ציוד עבודה','תעלות ניקוז','מקרר'] },
  { id:'presa', icon:'🔪', name:'מחלקת פריסה', temps:[], items:['מכונות וחלקי מכונות','שולחנות עבודה','פינוי אשפה','רצפה','סביבה','ניקוז תעלה'] },
  { id:'washing', icon:'🫧', name:'חדר שטיפה', temps:[], items:['כלים נקיים','לא על הרצפה','בלי מדבקות','חדר נקי'] },
  { id:'spices', icon:'🧂', name:'שקילת תבלינים', temps:[], items:['משטח עבודה','כלים','משקל רצפה'] },
  { id:'ramp', icon:'🚛', name:'רמפה', temps:[], items:['רצפה','קירות','תקרה'] },
  { id:'yard', icon:'🏭', name:'חצר', temps:[], items:['אזור קבלת הסחורה','רצפת החצר','דולבים'] }
];

const state = {};
DEPTS.forEach(d => {
  state[d.id] = { temps:{}, items:{}, notes:'' };
  d.temps.forEach(t => state[d.id].temps[t] = '');
  d.items.forEach(it => state[d.id].items[it] = { status:null, note:'', photos:[] });
});

function totalItems() { return DEPTS.reduce((s,d)=>s+d.items.length,0); }

function updateSummary() {
  let ok=0,bad=0,na=0;
  DEPTS.forEach(d=>Object.values(state[d.id].items).forEach(v=>{
    if(v.status==='ok') ok++;
    else if(v.status==='bad') bad++;
    else if(v.status==='na') na++;
  }));
  document.getElementById('cnt-ok').textContent=ok;
  document.getElementById('cnt-bad').textContent=bad;
  document.getElementById('cnt-na').textContent=na;
  const pct=Math.round((ok+bad+na)/totalItems()*100);
  document.getElementById('prog').style.width=pct+'%';
}

function deptBadge(id) {
  const items=Object.values(state[id].items);
  const filled=items.filter(v=>v.status).length;
  if(!filled) return `<span class="dbadge bpend">לא הוזן</span>`;
  if(items.some(v=>v.status==='bad')) return `<span class="dbadge bbad">✗ ליקויים</span>`;
  return `<span class="dbadge bok">✓ ${filled}/${items.length}</span>`;
}

function deptMeta(id) {
  const items=Object.values(state[id].items);
  const filled=items.filter(v=>v.status).length;
  const total=items.length;
  return `${filled}/${total} פריטים`;
}

function kb(str) { return btoa(unescape(encodeURIComponent(str))).replace(/=/g,'').replace(/\+/g,'p').replace(/\//g,'s'); }

function setStatus(deptId,item,val) {
  state[deptId].items[item].status=val;
  ['ok','bad','na'].forEach(s=>{
    const el=document.querySelector(`.sb[data-d="${deptId}"][data-i="${kb(item)}"][data-v="${s}"]`);
    if(el) el.className='sb'+(val===s?` a${s}`:'');
  });
  const card=document.getElementById('dept-'+deptId);
  card.querySelector('.dbw').innerHTML=deptBadge(deptId);
  card.querySelector('.dept-meta').textContent=deptMeta(deptId);
  if(Object.values(state[deptId].items).some(v=>v.status==='bad')) card.classList.add('has-bad');
  else card.classList.remove('has-bad');
  updateSummary();
}

function toggleNote(deptId,item) {
  const el=document.getElementById(`note-${deptId}-${kb(item)}`);
  const btn=document.getElementById(`notebtn-${deptId}-${kb(item)}`);
  if(!el) return;
  el.classList.toggle('show');
  if(el.classList.contains('show')) el.focus();
}

function updateNote(deptId,item,val) {
  state[deptId].items[item].note=val;
  const btn=document.getElementById(`notebtn-${deptId}-${kb(item)}`);
  if(btn) btn.className='note-toggle'+(val?' has-n':'');
}

function triggerCam(deptId,item) {
  document.getElementById(`file-${deptId}-${kb(item)}`)?.click();
}

function handlePhoto(deptId,item,input) {
  Array.from(input.files).forEach(file=>{
    const r=new FileReader();
    r.onload=e=>{
      state[deptId].items[item].photos.push(e.target.result);
      const thumbs=document.getElementById(`thumbs-${deptId}-${kb(item)}`);
      if(thumbs) thumbs.innerHTML+=`<img class="thumb" src="${e.target.result}">`;
      const btn=document.getElementById(`cambtn-${deptId}-${kb(item)}`);
      if(btn) btn.className='item-cam-btn has-p';
    };
    r.readAsDataURL(file);
  });
}

function buildDepts() {
  document.getElementById('depts-container').innerHTML=DEPTS.map(d=>{
    const tempsHTML = d.temps.length ? `
      <div class="temps-section">
        <div class="section-label">🌡 טמפרטורת חדרים</div>
        <div class="temps-grid">
          ${d.temps.map(t=>`
            <div class="temp-zone">
              <label>${t}</label>
              <div class="temp-row">
                <input class="temp-inp" type="number" step="0.1" placeholder="--"
                  oninput="state['${d.id}'].temps['${t}']=this.value">
                <span class="temp-unit">°C</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    ` : '';

    const itemsHTML = d.items.map(item=>`
      <div class="item-row">
        <div class="item-top">
          <span class="item-name">${item}</span>
          <button id="cambtn-${d.id}-${kb(item)}" class="item-cam-btn" onclick="triggerCam('${d.id}','${item}')">📷</button>
          <input type="file" accept="image/*" capture="environment" multiple class="hidden-file"
            id="file-${d.id}-${kb(item)}" onchange="handlePhoto('${d.id}','${item}',this)">
        </div>
        <div class="status-row">
          <button class="sb" data-d="${d.id}" data-i="${kb(item)}" data-v="ok" onclick="setStatus('${d.id}','${item}','ok')">✓ תקין</button>
          <button class="sb" data-d="${d.id}" data-i="${kb(item)}" data-v="bad" onclick="setStatus('${d.id}','${item}','bad')">✗ לא תקין</button>
          <button class="sb" data-d="${d.id}" data-i="${kb(item)}" data-v="na" onclick="setStatus('${d.id}','${item}','na')">— לא נבדק</button>
        </div>
        <button id="notebtn-${d.id}-${kb(item)}" class="note-toggle" onclick="toggleNote('${d.id}','${item}')">✏ הוסף הערה</button>
        <textarea id="note-${d.id}-${kb(item)}" class="item-note" rows="2" placeholder="הערה לפריט זה..."
          oninput="updateNote('${d.id}','${item}',this.value)"></textarea>
        <div id="thumbs-${d.id}-${kb(item)}" class="thumbs"></div>
      </div>
    `).join('');

    return `
      <div class="dept-card" id="dept-${d.id}">
        <div class="dept-hdr" onclick="toggleDept('${d.id}')">
          <div class="dept-left">
            <div class="dept-icon">${d.icon}</div>
            <div>
              <div class="dept-title">${d.name}</div>
              <div class="dept-meta">${deptMeta(d.id)}</div>
            </div>
          </div>
          <div class="dept-right">
            <span class="dbw">${deptBadge(d.id)}</span>
            <span class="chev" id="chev-${d.id}">▼</span>
          </div>
        </div>
        <div class="dept-body" id="body-${d.id}">
          ${tempsHTML}
          <div class="items-section">${itemsHTML}</div>
          <div class="dept-notes-section">
            <div class="section-label">📝 הערות כלליות למחלקה</div>
            <textarea rows="2" placeholder="הערות..." oninput="state['${d.id}'].notes=this.value"></textarea>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleDept(id) {
  const body=document.getElementById('body-'+id);
  const chev=document.getElementById('chev-'+id);
  const open=body.classList.toggle('open');
  chev.classList.toggle('open',open);
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function buildReport() {
  const date=document.getElementById('meta-date').value||'לא צוין';
  const time=document.getElementById('meta-time').value||'';
  const name=document.getElementById('meta-name').value||'לא צוין';
  let ok=0,bad=0,na=0,issues=[];
  let lines=[
    '🏭 בדיקת ניקיון – פתיחת יום עבודה',
    '📍 מפעל ניר עציון',
    `📅 תאריך: ${date} ${time}`,
    `👤 ממלא: ${name}`,
    '─────────────────────────'
  ];
  DEPTS.forEach(d=>{
    let dLines=[`${d.icon} ${d.name}`];
    if(d.temps.length) d.temps.forEach(t=>{
      const v=state[d.id].temps[t];
      dLines.push(`  🌡 ${t}: ${v||'לא נמדד'}°C`);
    });
    Object.entries(state[d.id].items).forEach(([item,v])=>{
      const s=v.status==='ok'?'✓':v.status==='bad'?'✗':v.status==='na'?'—':'·';
      dLines.push(`  ${s} ${item}`+(v.note?` – ${v.note}`:'')+(v.photos.length?` 📷${v.photos.length}`:''));
      if(v.status==='ok') ok++;
      else if(v.status==='bad'){ bad++; issues.push(`${d.name}: ${item}`); }
      else if(v.status==='na') na++;
    });
    if(state[d.id].notes) dLines.push(`  📝 ${state[d.id].notes}`);
    lines.push(...dLines,'');
  });
  lines.push('─────────────────────────',`סיכום: ✓ ${ok} תקין | ✗ ${bad} ליקויים | — ${na} לא נבדק`);
  if(issues.length){ lines.push('','⚠️ ליקויים:'); issues.forEach((x,i)=>lines.push(`${i+1}. ${x}`)); }
  return lines.join('\n');
}

function validate() {
  const name=document.getElementById('meta-name').value;
  const date=document.getElementById('meta-date').value;
  if(!name||!date){ showToast('יש למלא תאריך ושם ממלא'); return false; }
  return true;
}

function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function shareWA() {
  if(!validate()) return;
  window.open('https://wa.me/?text='+encodeURIComponent(buildReport()),'_blank');
}

// ── EmailJS send ──────────────────────────────────────────────
function getEJSConfig() {
  return {
    publicKey:  localStorage.getItem('ejs_pub')  || '',
    serviceId:  localStorage.getItem('ejs_svc')  || '',
    templateId: localStorage.getItem('ejs_tpl')  || ''
  };
}
function openEmailSetup() {
  const cfg = getEJSConfig();
  document.getElementById('ejs-pub').value = cfg.publicKey;
  document.getElementById('ejs-svc').value = cfg.serviceId;
  document.getElementById('ejs-tpl').value = cfg.templateId;
  document.getElementById('ejs-modal').style.display = 'flex';
}
function saveEmailSetup() {
  localStorage.setItem('ejs_pub', document.getElementById('ejs-pub').value.trim());
  localStorage.setItem('ejs_svc', document.getElementById('ejs-svc').value.trim());
  localStorage.setItem('ejs_tpl', document.getElementById('ejs-tpl').value.trim());
  document.getElementById('ejs-modal').style.display = 'none';
  showToast('הגדרות מייל נשמרו ✓');
}
function shareMail() {
  if (!validate()) return;
  const emailVal = document.getElementById('meta-email').value.trim();
  if (!emailVal) {
    showToast('יש להזין כתובת מייל בתחילת הטופס');
    document.getElementById('meta-email').focus();
    document.getElementById('meta-email').style.borderColor = 'var(--danger-border)';
    return;
  }
  if (!validateEmail(emailVal)) {
    showToast('כתובת המייל אינה תקינה');
    document.getElementById('meta-email').focus();
    document.getElementById('meta-email').style.borderColor = 'var(--danger-border)';
    return;
  }
  document.getElementById('meta-email').style.borderColor = 'var(--border)';
  const cfg = getEJSConfig();
  if (!cfg.publicKey || !cfg.serviceId || !cfg.templateId) {
    openEmailSetup();
    showToast('נא להגדיר את חשבון EmailJS תחילה');
    return;
  }
  const date = document.getElementById('meta-date').value;
  const name = document.getElementById('meta-name').value;
  let totalOk=0, totalBad=0, totalNa=0, issueLines=[];
  DEPTS.forEach(d => {
    Object.entries(state[d.id].items).forEach(([item, v]) => {
      if (v.status==='ok') totalOk++;
      else if (v.status==='bad') { totalBad++; issueLines.push('\u2022 '+d.name+': '+item+(v.note?' – '+v.note:'')); }
      else if (v.status==='na') totalNa++;
    });
  });
  const summaryLine = '✓ '+totalOk+' תקין | ✗ '+totalBad+' ליקויים | — '+totalNa+' לא נבדק';
  const issueBlock  = issueLines.length ? '\n\nליקויים:\n' + issueLines.join('\n') : '\n\nכל הפריטים תקינים ✓';
  const templateParams = {
    to_email:    emailVal,
    subject:     'בדיקת פתיחת יום עבודה – '+date+' – '+name,
    inspector:   name,
    date:        date,
    location:    'מפעל ניר עציון',
    summary:     summaryLine,
    issues:      issueBlock,
    full_report: buildReport()
  };
  showToast('שולח מייל...');
  document.querySelector('.btn-mail').disabled = true;
  emailjs.init(cfg.publicKey);
  emailjs.send(cfg.serviceId, cfg.templateId, templateParams)
    .then(() => {
      showToast('✓ המייל נשלח אל '+emailVal);
      document.querySelector('.btn-mail').disabled = false;
    })
    .catch(err => {
      console.error('EmailJS error:', err);
      showToast('שגיאה בשליחה – בדוק הגדרות EmailJS');
      document.querySelector('.btn-mail').disabled = false;
    });

function buildPDFHtml() {
  const date = document.getElementById('meta-date').value || 'לא צוין';
  const time = document.getElementById('meta-time').value || '';
  const name = document.getElementById('meta-name').value || 'לא צוין';
  const email = document.getElementById('meta-email').value || '';

  let totalOk=0, totalBad=0, totalNa=0, allIssues=[];

  // Pre-scan for totals
  DEPTS.forEach(d => {
    Object.values(state[d.id].items).forEach(v => {
      if(v.status==='ok') totalOk++;
      else if(v.status==='bad') { totalBad++; }
      else if(v.status==='na') totalNa++;
    });
    Object.entries(state[d.id].items).forEach(([item,v]) => {
      if(v.status==='bad') allIssues.push({dept: d.name, item, note: v.note});
    });
  });

  const scoreColor = totalBad===0 ? '#3b6d11' : totalBad<=3 ? '#c87a00' : '#c0001a';

  let deptsHTML = DEPTS.map(d => {
    const items = state[d.id].items;
    const dOk = Object.values(items).filter(v=>v.status==='ok').length;
    const dBad = Object.values(items).filter(v=>v.status==='bad').length;
    const dNa = Object.values(items).filter(v=>v.status==='na').length;
    const total = Object.keys(items).length;
    const dColor = dBad>0 ? '#c0001a' : dOk===total ? '#3b6d11' : '#555';

    const tempsRows = d.temps.length ? d.temps.map(t => {
      const v = state[d.id].temps[t] || 'לא נמדד';
      return `<tr style="background:#fff8f0"><td style="padding:5px 10px;font-size:12px;color:#555">🌡 ${t}</td><td style="padding:5px 10px;font-size:12px;font-weight:600;color:#c87a00;text-align:left">${v}°C</td><td></td></tr>`;
    }).join('') : '';

    const itemRows = Object.entries(items).map(([item, v]) => {
      const icon = v.status==='ok' ? '✓' : v.status==='bad' ? '✗' : v.status==='na' ? '—' : '·';
      const color = v.status==='ok' ? '#3b6d11' : v.status==='bad' ? '#c0001a' : '#888';
      const bg = v.status==='bad' ? '#fff5f5' : 'white';
      const statusText = v.status==='ok' ? 'תקין' : v.status==='bad' ? 'לא תקין' : v.status==='na' ? 'לא נבדק / לא רלוונטי' : 'לא הוזן';

      const photoHtml = v.photos.length ? `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">${
        v.photos.map(src => `<img src="${src}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #ddd">`).join('')
      }</div>` : '';

      const noteHtml = v.note ? `<div style="margin-top:4px;font-size:11px;color:#555;background:#f5f4f0;padding:4px 8px;border-radius:4px;border-right:3px solid #c87a00">הערה: ${v.note}</div>` : '';

      return `<tr style="background:${bg};border-bottom:1px solid #eee">
        <td style="padding:7px 10px;font-size:13px">
          ${item}
          ${noteHtml}
          ${photoHtml}
        </td>
        <td style="padding:7px 10px;font-size:13px;font-weight:700;color:${color};text-align:left;white-space:nowrap">
          ${icon} ${statusText}
        </td>
      </tr>`;
    }).join('');

    const deptNotesHtml = state[d.id].notes ? `<tr style="background:#fafaf8"><td colspan="2" style="padding:7px 10px;font-size:12px;color:#555;border-top:1px solid #eee"><strong>הערות:</strong> ${state[d.id].notes}</td></tr>` : '';

    return `
      <div style="margin-bottom:20px;page-break-inside:avoid">
        <table style="width:100%;border-collapse:collapse;border:1px solid #ddd;border-radius:8px;overflow:hidden">
          <thead>
            <tr style="background:${dBad>0?'#c0001a':'#2d2d2d'}">
              <th style="padding:9px 12px;text-align:right;color:white;font-size:14px;font-weight:700">
                ${d.icon} ${d.name}
              </th>
              <th style="padding:9px 12px;text-align:left;color:white;font-size:12px;font-weight:500;white-space:nowrap">
                ✓${dOk} ✗${dBad} —${dNa}
              </th>
            </tr>
          </thead>
          <tbody>
            ${tempsRows}
            ${itemRows}
            ${deptNotesHtml}
          </tbody>
        </table>
      </div>
    `;
  }).join('');

  const issuesSummary = allIssues.length ? `
    <div style="background:#fff5f5;border:2px solid #e24b4a;border-radius:8px;padding:14px;margin-bottom:20px;page-break-inside:avoid">
      <h3 style="color:#c0001a;margin-bottom:10px;font-size:14px">⚠️ ליקויים שדורשים טיפול (${allIssues.length})</h3>
      <table style="width:100%;border-collapse:collapse">
        ${allIssues.map((iss,i)=>`
          <tr style="border-bottom:1px solid #fdd">
            <td style="padding:5px 8px;font-size:12px;font-weight:600;color:#555;width:24px">${i+1}.</td>
            <td style="padding:5px 8px;font-size:12px"><strong>${iss.dept}</strong> — ${iss.item}</td>
            <td style="padding:5px 8px;font-size:11px;color:#888">${iss.note||''}</td>
          </tr>`).join('')}
      </table>
    </div>
  ` : `<div style="background:#eaf3de;border:2px solid #639922;border-radius:8px;padding:12px;margin-bottom:20px;color:#3b6d11;font-weight:600;font-size:14px;text-align:center">✓ כל הפריטים תקינים</div>`;

  return `<!DOCTYPE html>

    <button onclick="window.close()" style="background:#f5f4f0;color:#333;border:1px solid #ddd;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer">✕ סגור</button>
  </div>

  <!-- HEADER -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#c0001a;border-radius:10px 10px 0 0;color:white;margin-bottom:0">
    <img src="${NIR_LOGO}" style="height:50px;object-fit:contain;filter:brightness(0) invert(1)">
    <div style="text-align:center">
      <div style="font-size:18px;font-weight:700">צ'ק ליסט מפעל - ניר עציון</div>
      <div style="font-size:12px;opacity:.85;margin-top:2px">בדיקת ניקיון – פתיחת יום עבודה</div>

    <img src="${NEAT_LOGO}" style="height:36px;object-fit:contain;filter:brightness(0) invert(1)">

  <table style="width:100%;border-collapse:collapse;border:1px solid #ddd;border-top:none;margin-bottom:16px">
    <tr style="background:#f5f4f0">
      <td style="padding:8px 12px;font-size:12px;font-weight:700;width:120px;border-bottom:1px solid #ddd">תאריך:</td>
      <td style="padding:8px 12px;font-size:13px;border-bottom:1px solid #ddd">${date}</td>

      <td style="padding:8px 12px;font-size:13px;border-bottom:1px solid #ddd">מפעל</td>
      <td style="padding:8px 12px;font-size:12px;font-weight:700;border-bottom:1px solid #ddd">ממלא:</td>
      <td style="padding:8px 12px;font-size:13px;border-bottom:1px solid #ddd">${name}</td>
    </tr>
    <tr style="background:#f5f4f0">
      <td style="padding:8px 12px;font-size:12px;font-weight:700">סיכום:</td>
      <td colspan="3" style="padding:8px 12px">
        <span style="color:#3b6d11;font-weight:700;font-size:14px">✓ ${totalOk} תקין</span>
        &nbsp;&nbsp;
        <span style="color:#c0001a;font-weight:700;font-size:14px">✗ ${totalBad} לא תקין</span>
        &nbsp;&nbsp;
        <span style="color:#888;font-size:13px">— ${totalNa} לא נבדק</span>
      </td>
    </tr>
  </table>

  <!-- ISSUES SUMMARY -->
  ${issuesSummary}

  <!-- DEPT SECTIONS -->
  ${deptsHTML}

  <!-- FOOTER -->

    <a href="https://www.emailjs.com" target="_blank">emailjs.com</a> → צור חשבון → Service → Template → קבל Public Key</p>

    <div class="ejs-field">
      <label>Public Key</label>
      <input id="ejs-pub" type="text" placeholder="user_xxxxxxxxxxxxxxx" autocomplete="off">
    </div>
    <div class="ejs-field">
      <label>Service ID</label>
      <input id="ejs-svc" type="text" placeholder="service_xxxxxxx" autocomplete="off">
    </div>
    <div class="ejs-field">
      <label>Template ID</label>
      <input id="ejs-tpl" type="text" placeholder="template_xxxxxxx" autocomplete="off">
    </div>

    <div class="ejs-note">
      <b>משתנים לתבנית ה-Template:</b><br>
      {{to_email}} · {{subject}} · {{inspector}} · {{date}} · {{location}} · {{summary}} · {{issues}} · {{full_report}}
    </div>

    <div class="ejs-row">
      <button class="ejs-cancel" onclick="document.getElementById('ejs-modal').style.display='none'">ביטול</button>
      <button class="ejs-save" onclick="saveEmailSetup()">שמור הגדרות</button>
    </div>
  </div>
</div>
</body>
</html>`;
}

function dlPDF() {
  if(!validate()) return;
  showToast('מכין דוח...');
  const html = buildPDFHtml();
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if(!w) {
    // fallback: download as file
    const a = document.createElement('a');
    a.href = url;
    const date = document.getElementById('meta-date').value;
    const name = document.getElementById('meta-name').value;
    a.download = `דוח_${date}_${name}.html`;
    a.click();
  }
  URL.revokeObjectURL(url);
  showToast('הדוח נפתח בחלון חדש');
}

function shareMail() {
  if(!validate()) return;
  const date = document.getElementById('meta-date').value;
  const name = document.getElementById('meta-name').value;
  const emailVal = document.getElementById('meta-email').value.trim();

  if(!emailVal) {
    showToast('יש להזין כתובת מייל בתחילת הטופס');
    document.getElementById('meta-email').focus();
    document.getElementById('meta-email').style.borderColor='var(--danger-border)';
    return;
  }
  if(!validateEmail(emailVal)) {
    showToast('כתובת המייל אינה תקינה');
    document.getElementById('meta-email').focus();
    document.getElementById('meta-email').style.borderColor='var(--danger-border)';
    return;
  }

  document.getElementById('meta-email').style.borderColor='var(--border)';

  // Open PDF in new window with mailto button inside
  showToast('מכין דוח לשליחה...');
  const html = buildPDFHtml();
  const mailBtn = `<div class="no-print" style="margin-bottom:16px;text-align:center;background:#fdf0f2;padding:12px;border-radius:8px;border:1px solid #f5c0c0">
    <div style="font-size:13px;color:#555;margin-bottom:8px">שולח אל: <strong>${emailVal}</strong></div>
    <button onclick="sendMail()" style="background:#c0001a;color:white;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">✉ שלח במייל</button>
  </div>`;

  // Build text version for email body
  const textReport = buildReport();
  const sub = encodeURIComponent('בדיקת פתיחת יום עבודה – ' + date + ' – ' + name);
  const body = encodeURIComponent(textReport);
  const mailtoUrl = 'mailto:' + encodeURIComponent(emailVal) + '?subject=' + sub + '&body=' + body;

  const w = window.open('', '_blank');
  if(w) {
    w.document.write(html.replace('<body', `<script>function sendMail(){window.location.href='${mailtoUrl}';}<\/script><body`).replace('class="no-print" style="margin-bottom:16px;text-align:center"', 'class="no-print" style="margin-bottom:16px;text-align:center;display:none"').replace('</body>', mailBtn.replace('no-print','') + '</body>'));
    w.document.close();
  } else {
    window.location.href = mailtoUrl;
  }
  showToast('שולח דוח אל ' + emailVal);
}

document.getElementById('meta-time').value=now.toTimeString().slice(0,5);
